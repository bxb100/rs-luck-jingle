[package]
name = "rs-luck-jingle"
version = "0.2.0"
edition = "2024"
default-run = "rs-luck-jingle"

[[bin]]
name = "rs-luck-jingle"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
actix-web = { version = "4.14.0", default-features = false, features = ["macros"] }
anyhow = "1.0.104"
chrono = "0.4.45"
env_logger = "0.11.11"
image = "0.25.10"
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
log = "0.4.33"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["sync", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd", "rfcomm"] }
dbus = { version = "0.9.12", features = ["vendored"] }
futures = "0.3.33"
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-io-bluetooth = "0.3.2"

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
